# Local development infrastructure only. Credentials here are local-dev placeholders and
# must never be reused anywhere else. Surfpool/validator run natively, not in Docker.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: mandate
      POSTGRES_PASSWORD: mandate_local_dev_only
      POSTGRES_DB: mandate
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - mandate_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mandate"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mandate_pg:
